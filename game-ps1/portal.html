<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <title>看山任意门</title>
    <style>
      html, body { margin: 0; padding: 0; background: #05060a; overflow: hidden; height: 100%; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; touch-action: none; }
      #app canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

      /* portal host chrome (created by src/portal/host.ts via classList/textContent).
         The fade duration mirrors DEFAULT_PORTAL_TIMINGS.fadeMs in host.ts. */
      .portal-fade {
        position: fixed; inset: 0; z-index: 40;
        background: #ffffff; opacity: 0; pointer-events: none;
        transition: opacity 320ms ease;
      }
      .portal-fade--on { opacity: 1; pointer-events: auto; }

      .portal-frame {
        position: fixed; inset: 0; z-index: 30;
        width: 100%; height: 100%; border: 0; background: #000;
      }

      .portal-return {
        position: fixed; top: 12px; left: 12px; z-index: 50;
        padding: 6px 14px; font-size: 13px; line-height: 1.4;
        color: #eee; background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px;
        cursor: pointer; user-select: none;
      }
      .portal-return[hidden] { display: none; }

      .portal-error {
        position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 60;
        max-width: min(80vw, 40em); padding: 10px 16px;
        color: #ffd9d9; background: rgba(40, 0, 0, 0.85);
        border: 1px solid rgba(255, 120, 120, 0.5); border-radius: 8px;
        font-size: 13px; line-height: 1.5;
      }
      .portal-error[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/portal/boot.ts"></script>
  </body>
</html>
